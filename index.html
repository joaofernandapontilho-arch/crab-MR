<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Box - Hand Tracking & Camera</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Vídeo da câmera fica oculto e serve de input para o MediaPipe */
        #input-video {
            display: none;
        }
        /* Tela de toque inicial para habilitar áudio/sensores/permissões no Android */
        #permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #permission-overlay button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
    </style>

    <!-- Bibliotecas Three.js e Efeitos Estéreo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <!-- Bibliotecas MediaPipe para Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="permission-overlay">
        <h2>VR Box Hand Tracking</h2>
        <p>Toque no botão abaixo para permitir o uso da câmera frontal e dos sensores de movimento do seu celular.</p>
        <button id="start-btn">ENTRAR NO MODO VR</button>
    </div>

    <video id="input-video" playsinline></video>
    <div id="webgl-container"></div>

    <script>
        let scene, camera, renderer, effect, controls;
        let leftHandSpheres = [];
        let rightHandSpheres = [];
        let handsInitialized = false;

        // Inicializa a cena 3D Three.js
        function initThree() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Efeito Estéreo Dividido para as Lentes do VR Box
            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.separation = 0.3;

            // Controles de Giroscópio
            controls = new THREE.DeviceOrientationControls(camera, true);

            // Luz ambiente e direcional
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            // Criar esferas visuais para as 21 juntas da mão esquerda (Azul)
            const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16);
            const leftMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3 });
            for (let i = 0; i < 21; i++) {
                const mesh = new THREE.Mesh(sphereGeo, leftMat);
                mesh.visible = false;
                scene.add(mesh);
                leftHandSpheres.push(mesh);
            }

            // Criar esferas visuais para as 21 juntas da mão direita (Verde)
            const rightMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 });
            for (let i = 0; i < 21; i++) {
                const mesh = new THREE.Mesh(sphereGeo, rightMat);
                mesh.visible = false;
                scene.add(mesh);
                rightHandSpheres.push(mesh);
            }

            // Grid de referência no chão para ambientação 3D
            const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            grid.position.y = -2;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            effect.render(scene, camera);
        }

        // Configuração do MediaPipe Hands para rastrear as 2 mãos
        function initMediaPipe() {
            const videoElement = document.getElementById('input-video');

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,             // Rastreia até 2 mãos simultaneamente
                modelComplexity: 1,         // Equilíbrio entre performance e precisão
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            cameraUtils.start().then(() => {
                console.log("Câmera frontal iniciada para Hand Tracking!");
            }).catch(err => {
                console.error("Erro ao acessar a câmera:", err);
                alert("Erro ao abrir a câmera. Verifique as permissões do navegador.");
            });
        }

        // Processa os pontos 3D detectados nas mãos e atualiza as esferas no espaço 3D
        function onHandResults(results) {
            // Oculta todas as esferas por padrão a cada quadro
            leftHandSpheres.forEach(s => s.visible = false);
            rightHandSpheres.forEach(s => s.visible = false);

            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                return;
            }

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const classification = results.multiHandedness[i];
                
                // No MediaPipe, 'Left' / 'Right' da câmera frontal invertem o lado espelhado real do usuário
                // Usamos a classificação para separar as esferas correspondentes
                const isLeftHand = classification.label === 'Left';
                const sphereArray = isLeftHand ? leftHandSpheres : rightHandSpheres;

                for (let j = 0; j < landmarks.length; j++) {
                    const lm = landmarks[j];
                    const sphere = sphereArray[j];
                    if (sphere) {
                        // Mapeia as coordenadas 2D/3D da câmera para o espaço virtual em frente à câmera do Three.js
                        // X inverte devido ao espelhamento da câmera frontal
                        const x = (0.5 - lm.x) * 3.5;
                        const y = (0.5 - lm.y) * 3.5;
                        const z = -lm.z * 3.0 - 1.5; // Profundidade estimada em frente aos olhos

                        sphere.position.set(x, y, z);
                        sphere.visible = true;
                    }
                }
            }
        }

        // Gatilho de início do usuário (essencial para desbloquear permissões em smartphones)
        document.getElementById('start-btn').addEventListener('click', () => {
            const overlay = document.getElementById('permission-overlay');
            overlay.style.display = 'none';

            // Solicita permissão de orientação em dispositivos iOS / Android modernos
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(console.error);
            }

            initThree();
            initMediaPipe();
        });
    </script>
</body>
</html>
