<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Box - FullScreen Rear Camera & Hand Tracking</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #input-video {
            display: none;
        }
        #permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #permission-overlay button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
    </style>

    <!-- Bibliotecas Three.js e Efeitos Estéreo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <!-- Bibliotecas MediaPipe para Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="permission-overlay">
        <h2>VR Box Realidade Aumentada</h2>
        <p>Toque abaixo para ativar a câmara traseira em tela cheia e o rastreio de mãos.</p>
        <button id="start-btn">ENTRAR NO MODO VR</button>
    </div>

    <video id="input-video" playsinline></video>
    <div id="webgl-container"></div>

    <script>
        let scene, camera, renderer, effect, controls;
        let videoTexture, videoPlane;
        let leftHandGroup, rightHandGroup;

        function initThree() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.separation = 0.3;

            controls = new THREE.DeviceOrientationControls(camera, true);

            // Plano de vídeo da câmara traseira cobrindo a tela inteira em profundidade
            const videoElement = document.getElementById('input-video');
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;

            // Geometria esticada para ocupar o campo de visão completo
            const planeGeo = new THREE.PlaneGeometry(25, 14);
            const planeMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
            videoPlane = new THREE.Mesh(planeGeo, planeMat);
            videoPlane.position.set(0, 0, -5);
            scene.add(videoPlane);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 1));

            // Grupos para as mãos
            leftHandGroup = createHandStructure(0x38bdf8); 
            rightHandGroup = createHandStructure(0x34d399); 
            scene.add(leftHandGroup);
            scene.add(rightHandGroup);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createHandStructure(colorHex) {
            const group = new THREE.Group();
            const sphereGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 });
            
            for (let i = 0; i < 21; i++) {
                const mesh = new THREE.Mesh(sphereGeo, mat);
                mesh.visible = false;
                group.add(mesh);
            }
            return group;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            effect.render(scene, camera);
        }

        function initMediaPipe() {
            const videoElement = document.getElementById('input-video');

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            // Força a utilização estrita da câmara traseira (environment)
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720,
                facingMode: "environment"
            });

            cameraUtils.start().catch(err => {
                console.error("Erro na câmara traseira:", err);
                // Fallback caso o telemóvel restrincha o "environment" exato
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                    .then(stream => { videoElement.srcObject = stream; videoElement.play(); })
                    .catch(e => alert("Não foi possível aceder à câmara traseira."));
            });
        }

        function onHandResults(results) {
            leftHandGroup.children.forEach(m => m.visible = false);
            rightHandGroup.children.forEach(m => m.visible = false);

            if (!results.multiHandLandmarks) return;

            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const classification = results.multiHandedness[i];
                const isLeft = classification.label === 'Left';
                const targetGroup = isLeft ? leftHandGroup : rightHandGroup;

                for (let j = 0; j < landmarks.length; j++) {
                    const lm = landmarks[j];
                    const sphere = targetGroup.children[j];
                    if (sphere) {
                        // Mapeamento otimizado para a câmara traseira em tela cheia
                        sphere.position.set(
                            (0.5 - lm.x) * 4.0,
                            (0.5 - lm.y) * 4.0,
                            -2.5 + (lm.z * 1.5)
                        );
                        sphere.visible = true;
                    }
                }
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('permission-overlay').style.display = 'none';
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(console.error);
            }
            initThree();
            initMediaPipe();
        });
    </script>
</body>
</html>
